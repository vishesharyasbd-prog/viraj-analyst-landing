<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Viraj Analyst | Join Telegram</title>
  <meta name="description" content="Join Viraj Analyst on Telegram for sports analysis and updates.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f7fa;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 24px;
      padding: 42px 28px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 78px;
      height: 78px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #111827;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .tagline {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .features {
      text-align: left;
      margin: 0 auto 30px;
      max-width: 350px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      color: #374151;
      font-size: 15px;
    }

    .check {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #eef2ff;
      color: #4f46e5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .join-btn {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 12px;
      background: #229ed9;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .join-btn:hover {
      transform: translateY(-2px);
      background: #168ac0;
    }

    .small-text {
      margin-top: 18px;
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.5;
    }

    @media (max-width: 400px) {
      .container {
        padding: 35px 20px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">VA</div>

    <h1>Viraj Analyst</h1>

    <p class="tagline">
      Stay connected with Viraj Analyst for sports analysis,
      insights and regular updates.
    </p>

    <div class="features">

      <div class="feature">
        <div class="check">✓</div>
        <span>Regular sports analysis & updates</span>
      </div>

      <div class="feature">
        <div class="check">✓</div>
        <span>Easy-to-follow insights</span>
      </div>

      <div class="feature">
        <div class="check">✓</div>
        <span>Direct updates on Telegram</span>
      </div>

    </div>

    <a
      class="join-btn"
      href="https://t.me/+___XdgExJ09iNDY1"
      target="_blank"
      rel="noopener noreferrer">
      JOIN TELEGRAM →
    </a>

    <p class="small-text">
      By joining, you agree to Telegram's terms and conditions.
    </p>

  </div>

</body>
</html>
